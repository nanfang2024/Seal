# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users should change/override as necessary.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# 沙箱内存受限：Kotlin 编译器在 Gradle daemon 进程内运行，避免多 JVM 叠加导致 OOM
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ABI_FILTERS=arm64-v8a
android.nonFinalResIds=true
org.gradle.configuration-cache=true
# 沙箱出口代理（Gradle 不读取 http_proxy 环境变量，需显式声明）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
